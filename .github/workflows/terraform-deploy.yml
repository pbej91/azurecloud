name: Terraform Deploy to Azure

on:
  issue_comment:
    types: [created, edited]
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}
  TERRAFORM_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  parse-commit:
    name: Parse Terraform Target
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, 'terraform:')
    outputs:
      subscription: ${{ steps.parse.outputs.subscription }}
      region: ${{ steps.parse.outputs.region }}
      terraform-target: ${{ steps.parse.outputs.terraform-target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse Comment for Terraform Target
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          echo "Comment: $COMMENT"

          # Parse terraform: (subscription):region format from comment
          if [[ $COMMENT =~ terraform:\ \(([^)]+)\):([a-z0-9-]+) ]]; then
            SUBSCRIPTION="${BASH_REMATCH[1]}"
            REGION="${BASH_REMATCH[2]}"
            TERRAFORM_TARGET="${SUBSCRIPTION}-${REGION}"

            echo "subscription=$SUBSCRIPTION" >> $GITHUB_OUTPUT
            echo "region=$REGION" >> $GITHUB_OUTPUT
            echo "terraform-target=$TERRAFORM_TARGET" >> $GITHUB_OUTPUT

            echo "✅ Parsed terraform target: $TERRAFORM_TARGET"
          else
            echo "❌ Invalid format in comment"
            echo "Expected format: terraform: (subscription):region"
            echo "Example: terraform: (prod):us-east-1"
            exit 1
          fi

      - name: Comment Success
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Terraform target parsed: \`${{ steps.parse.outputs.terraform-target }}\`\n\n🔄 Starting pipeline...`
            });
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: parse-commit
    if: github.event_name == 'issue_comment'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
          enable-AzPSSession: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TERRAFORM_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TERRAFORM_BACKEND_KEY }}" \
            -backend-config="access_key=${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}"
        env:
          ARM_USE_OIDC: true

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan (Diff)
        run: |
          cd terraform
          terraform plan \
            -var="subscription=${{ needs.parse-commit.outputs.subscription }}" \
            -var="region=${{ needs.parse-commit.outputs.region }}" \
            -out=tfplan
        env:
          ARM_USE_OIDC: true
          TF_VAR_environment: ${{ secrets.TERRAFORM_ENV }}

      - name: Generate Plan Diff Output
        run: |
          cd terraform
          terraform show tfplan > tfplan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Read and Comment Plan Diff
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planFile = 'terraform/tfplan.txt';

            let planContent = '❌ No plan generated';
            if (fs.existsSync(planFile)) {
              try {
                planContent = fs.readFileSync(planFile, 'utf8');
              } catch (e) {
                planContent = 'Could not read plan: ' + e.message;
              }
            }

            const maxLength = 65000;
            if (planContent.length > maxLength) {
              planContent = planContent.substring(0, maxLength) + '\n... (truncated)';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan Diff\n\n**Target**: \`${{ needs.parse-commit.outputs.terraform-target }}\`\n\n\`\`\`diff\n${planContent}\n\`\`\``
            });
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
          enable-AzPSSession: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TERRAFORM_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TERRAFORM_BACKEND_KEY }}" \
            -backend-config="access_key=${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}"
        env:
          ARM_USE_OIDC: true

      - name: Terraform Plan Before Apply
        run: |
          cd terraform
          terraform plan
        env:
          ARM_USE_OIDC: true
          TF_VAR_environment: ${{ secrets.TERRAFORM_ENV }}

      - name: Create Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  terraform-test:
    name: Terraform Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: |
          cd terraform
          terraform fmt -recursive -check

      - name: TFLint Check
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          cd terraform
          tflint --init
          tflint --format compact
