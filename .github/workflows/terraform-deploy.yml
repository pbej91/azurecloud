name: Terraform Deploy (Apply)

on:
  issue_comment:
    types: [created, edited]

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}
  TERRAFORM_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  parse-deploy-comment:
    name: Parse Deploy Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, 'terraform: deploy:')
    outputs:
      target: ${{ steps.parse.outputs.target }}
      subscription: ${{ steps.parse.outputs.subscription }}
      region: ${{ steps.parse.outputs.region }}

    steps:
      - name: Parse Comment
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          echo "Comment: $COMMENT"

          # Parse terraform: deploy: subscription.region format
          if [[ $COMMENT =~ terraform:\ deploy:\ ([a-z0-9.]+) ]]; then
            TARGET="${BASH_REMATCH[1]}"
            SUBSCRIPTION=$(echo $TARGET | cut -d. -f1)
            REGION=$(echo $TARGET | cut -d. -f2)

            echo "target=$TARGET" >> $GITHUB_OUTPUT
            echo "subscription=$SUBSCRIPTION" >> $GITHUB_OUTPUT
            echo "region=$REGION" >> $GITHUB_OUTPUT

            echo "✅ Parsed terraform deploy target: $TARGET"
          else
            echo "❌ Invalid format"
            echo "Expected: terraform: deploy: subscription.region"
            echo "Example: terraform: deploy: sbx1.eastus"
            exit 1
          fi

      - name: Comment - Deployment Started
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Terraform Deploy Started**\n\nTarget: \`${{ steps.parse.outputs.target }}\`\n\nRunning \`terraform apply\`...`
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: parse-deploy-comment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
          enable-AzPSSession: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TERRAFORM_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TERRAFORM_BACKEND_KEY }}" \
            -backend-config="access_key=${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}"
        env:
          ARM_USE_OIDC: true

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="subscription=${{ needs.parse-deploy-comment.outputs.subscription }}" \
            -var="region=${{ needs.parse-deploy-comment.outputs.region }}" \
            -out=tfplan
        env:
          ARM_USE_OIDC: true
          TF_VAR_environment: ${{ secrets.TERRAFORM_ENV }}

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
        env:
          ARM_USE_OIDC: true

      - name: Comment - Deployment Complete
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Terraform Deploy Completed Successfully**\n\nTarget: \`${{ needs.parse-deploy-comment.outputs.target }}\`\n\n🎉 Resources have been deployed!`
            });

      - name: Comment - Deployment Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Terraform Deploy Failed**\n\nTarget: \`${{ needs.parse-deploy-comment.outputs.target }}\`\n\nPlease check the workflow logs for details.`
            });
