name: Terraform Diff (Plan)

on:
  issue_comment:
    types: [created, edited]

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}
  TERRAFORM_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  parse-diff-comment:
    name: Parse Diff Comment
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'terraform: diff:')
    outputs:
      target: ${{ steps.parse.outputs.target }}
      subscription: ${{ steps.parse.outputs.subscription }}
      region: ${{ steps.parse.outputs.region }}

    steps:
      - name: Parse Comment
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          echo "Comment: $COMMENT"

          # Parse terraform: diff: subscription.region format
          if [[ $COMMENT =~ terraform:\ diff:\ ([a-z0-9.]+) ]]; then
            TARGET="${BASH_REMATCH[1]}"
            SUBSCRIPTION=$(echo $TARGET | cut -d. -f1)
            REGION=$(echo $TARGET | cut -d. -f2)

            echo "target=$TARGET" >> $GITHUB_OUTPUT
            echo "subscription=$SUBSCRIPTION" >> $GITHUB_OUTPUT
            echo "region=$REGION" >> $GITHUB_OUTPUT

            echo "✅ Parsed terraform diff target: $TARGET"
          else
            echo "❌ Invalid format"
            echo "Expected: terraform: diff: subscription.region"
            echo "Example: terraform: diff: sbx1.eastus"
            exit 1
          fi

      - name: Comment - Starting Diff
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔄 **Terraform Diff Started**\n\nTarget: \`${{ steps.parse.outputs.target }}\`\n\nRunning \`terraform plan\`...`
            });

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: parse-diff-comment
    environment:
      name: terraform-approval
      url: https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login with OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
          enable-AzPSSession: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TERRAFORM_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TERRAFORM_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TERRAFORM_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TERRAFORM_BACKEND_KEY }}" \
            -backend-config="access_key=${{ secrets.TERRAFORM_BACKEND_ACCESS_KEY }}"
        env:
          ARM_USE_OIDC: true

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="subscription=${{ needs.parse-diff-comment.outputs.subscription }}" \
            -var="region=${{ needs.parse-diff-comment.outputs.region }}" \
            -out=tfplan
        env:
          ARM_USE_OIDC: true
          TF_VAR_environment: ${{ secrets.TERRAFORM_ENV }}

      - name: Generate Readable Plan
        run: |
          cd terraform
          terraform show tfplan > tfplan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.parse-diff-comment.outputs.target }}
          path: terraform/tfplan
          retention-days: 5

      - name: Post Diff Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planFile = 'terraform/tfplan.txt';

            let planContent = '❌ No plan generated';
            if (fs.existsSync(planFile)) {
              try {
                planContent = fs.readFileSync(planFile, 'utf8');
              } catch (e) {
                planContent = 'Error: ' + e.message;
              }
            }

            const maxLength = 65000;
            if (planContent.length > maxLength) {
              planContent = planContent.substring(0, maxLength) + '\n... (truncated)';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan Diff\n\n**Target**: \`${{ needs.parse-diff-comment.outputs.target }}\`\n\n\`\`\`\n${planContent}\n\`\`\`\n\n**Next Step**: Review the plan above, then comment with:\n\`terraform: deploy: ${{ needs.parse-diff-comment.outputs.target }}\``
            });

      - name: Comment - Waiting for Approval
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Diff Complete - Awaiting Manual Approval**\n\nTo proceed with deployment, manually approve in GitHub environment approval, then trigger deploy with:\n\n\`terraform: deploy: ${{ needs.parse-diff-comment.outputs.target }}\``
            });
